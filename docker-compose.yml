services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fraud:fraud@db:5432/frauddb
      # Ollama runs on your Mac, not in a container; Docker Desktop exposes the host as host.docker.internal.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Pause/resume of human reviews survives restarts when this is set (otherwise in-memory):
      # LANGGRAPH_POSTGRES_URL: postgresql://fraud:fraud@db:5432/frauddb
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: frauddb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
